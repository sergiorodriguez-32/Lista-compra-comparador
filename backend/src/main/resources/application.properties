spring.application.name=listacompra

# Lee el .env de la raíz del repo como si fuera un .properties. "optional:" hace que no falle
# si no existe. Se prueban las dos rutas porque mvnw arranca desde backend/ y el IDE puede
# arrancar desde la raíz. Las variables de entorno reales siguen teniendo prioridad.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# Conexión a PostgreSQL (contenedor listacompra-db, puerto 5435)
spring.datasource.url=jdbc:postgresql://localhost:5435/listacompracomparador
# Si DB_USER/DB_PASSWORD no están definidas, se usan las del .env (las mismas que Docker)
spring.datasource.username=${DB_USER:${POSTGRES_USER}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD}}

# Hibernate solo valida que las entidades encajan con las tablas; el esquema lo crea Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

#Configuracion de JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
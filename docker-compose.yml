services:
  db:
    image: postgres:16
    container_name: listacompra-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - listacompra-data:/var/lib/postgresql/data

volumes:
  listacompra-data:
  